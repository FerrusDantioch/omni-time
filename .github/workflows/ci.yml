name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification syntaxique JS
        run: |
          for f in *.js tests/*.js tests/*.mjs; do
            node --check "$f"
          done
      - name: Contrôles statiques (CSP, .nojekyll, SW réciproque)
        run: node tests/verifier-statique.mjs
      - name: Tests E2E Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/tester.js
